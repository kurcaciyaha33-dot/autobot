name: WhatsApp Scheduled Message Bot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coco-whatsapp-bot
  cancel-in-progress: false

jobs:
  whatsapp-bot:
    name: CoCo Production
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ==========================================
      # STEP 1 - INSTALL DEPENDENCY
      # ==========================================

      - name: Step 1 - Checkout Repository
        uses: actions/checkout@v4

      - name: Record Start Time
        id: start
        run: |
          echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ==========================================
      # STEP 2 - MEMBACA SECRETS
      # ==========================================

      - name: Step 2 - Membaca Secrets
        env:
          API_FONNTE: ${{ secrets.API_FONNTE }}
          UID_GB: ${{ secrets.UID_GB }}
          GHP_T: ${{ secrets.GHP_T }}
          REPOS: ${{ secrets.REPOS }}
        run: |
          if [ -z "$API_FONNTE" ]; then
            echo "API_FONNTE missing"
            exit 1
          fi

          if [ -z "$UID_GB" ]; then
            echo "UID_GB missing"
            exit 1
          fi

          if [ -z "$GHP_T" ]; then
            echo "GHP_T missing"
            exit 1
          fi

          if [ -z "$REPOS" ]; then
            echo "REPOS missing"
            exit 1
          fi

          echo "All secrets successfully loaded."

      # ==========================================
      # STEP 3 - MENJALANKAN BOT.PY
      # ==========================================

      - name: Step 3 - Menjalankan bot.py
        env:
          API_FONNTE: ${{ secrets.API_FONNTE }}
          UID_GB: ${{ secrets.UID_GB }}
          RUN_START_EPOCH: ${{ steps.start.outputs.start_epoch }}
        run: |
          python -u bot.py

      # ==========================================
      # STEP 4 - KEEP ALIVE
      # Target: 05:58:59 sejak pencatatan start
      # ==========================================

      - name: Step 4 - Keep Alive
        env:
          RUN_START_EPOCH: ${{ steps.start.outputs.start_epoch }}
        run: |
          python - <<'PY'
          import os
          import time

          start = int(os.environ["RUN_START_EPOCH"])

          target = start + (5 * 3600) + (58 * 60) + 59

          print("Keep Alive activated.")
          print("Waiting until 05:58:59...")

          while True:
              remaining = target - time.time()

              if remaining <= 0:
                  break

              time.sleep(min(remaining, 10))

          print("Keep Alive completed.")
          PY

      # ==========================================
      # STEP 5 - SELF RESTART RUN.YML
      # ==========================================

      - name: Step 5 - Restart Workflow
        if: success()
        env:
          GHP_T: ${{ secrets.GHP_T }}
          REPOS: ${{ secrets.REPOS }}
        run: |
          python - <<'PY'
          import os
          import requests
          import sys
          import time

          token = os.environ["GHP_T"].strip()
          repo = os.environ["REPOS"].strip()

          if "/" not in repo:
              print("Invalid REPOS format. Use username/repo")
              sys.exit(1)

          owner, name = repo.split("/", 1)

          if not owner or not name or "/" in name:
              print("Invalid repository information.")
              sys.exit(1)

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          api = "https://api.github.com"

          print("================================")
          print("       COCO SELF RESTART")
          print("================================")
          print(f"Repository: {owner}/{name}")

          # Get default branch
          repo_url = f"{api}/repos/{owner}/{name}"

          try:
              response = requests.get(
                  repo_url,
                  headers=headers,
                  timeout=20
              )

              response.raise_for_status()

              branch = response.json()["default_branch"]

              print(f"Default branch: {branch}")

          except Exception as error:
              print("Failed to read repository:", error)
              sys.exit(1)

          # Dispatch run.yml
          workflow_url = (
              f"{api}/repos/{owner}/{name}"
              "/actions/workflows/run.yml/dispatches"
          )

          payload = {
              "ref": branch
          }

          for attempt in range(1, 4):

              try:
                  response = requests.post(
                      workflow_url,
                      headers=headers,
                      json=payload,
                      timeout=25
                  )

                  if response.status_code == 204:
                      print("================================")
                      print("SELF RESTART SUCCESS")
                      print("Next workflow has been dispatched.")
                      print("================================")
                      sys.exit(0)

                  print(
                      f"Attempt {attempt} failed:",
                      response.status_code,
                      response.text
                  )

              except Exception as error:
                  print(f"Attempt {attempt} error:", error)

              if attempt < 3:
                  time.sleep(5)

          print("SELF RESTART FAILED.")
          sys.exit(1)
          PY
