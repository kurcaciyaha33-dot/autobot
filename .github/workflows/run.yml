
name: CoCo Production - WhatsApp & Telegram

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coco-production-whatsapp
  cancel-in-progress: false

jobs:
  production:
    name: CoCo Production
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ======================================
      # STEP 1 - INSTALL DEPENDENCY
      # ======================================

      - name: Step 1 - Install Dependency
        uses: actions/checkout@v4

      - name: Record Start Time
        id: start
        run: |
          echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install requests python-telegram-bot

      # ======================================
      # STEP 2 - READ SECRETS
      # ======================================

      - name: Step 2 - Membaca Secrets
        env:
          API_FONNTE: ${{ secrets.API_FONNTE }}
          UID_GB: ${{ secrets.UID_GB }}
          UID_GB2: ${{ secrets.UID_GB2 }}
          OWNER_NUMBER: ${{ secrets.OWNER_NUMBER }}
          GHP_T: ${{ secrets.GHP_T }}
          REPOS: ${{ secrets.REPOS }}
          TELE_BOT: ${{ secrets.TELE_BOT }}
          PASS_SYS: ${{ secrets.PASS_SYS }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          for name in \
            API_FONNTE \
            UID_GB \
            UID_GB2 \
            OWNER_NUMBER \
            GHP_T \
            REPOS \
            TELE_BOT \
            PASS_SYS \
            ADMIN_TOKEN
          do
            if [ -z "${!name}" ]; then
              echo "Missing secret: $name"
              exit 1
            fi
          done

          echo "All secrets loaded."

      # ======================================
      # STEP 3 - RUN BOTH BOTS
      # ======================================

      - name: Step 3 - Menjalankan bot.py & bott.py
        env:
          API_FONNTE: ${{ secrets.API_FONNTE }}
          UID_GB: ${{ secrets.UID_GB }}
          UID_GB2: ${{ secrets.UID_GB2 }}
          OWNER_NUMBER: ${{ secrets.OWNER_NUMBER }}
          TELE_BOT: ${{ secrets.TELE_BOT }}
          PASS_SYS: ${{ secrets.PASS_SYS }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          RUN_START_EPOCH: ${{ steps.start.outputs.start_epoch }}
        shell: bash
        run: |
          set +e

          echo "Starting WhatsApp Scheduler..."
          python -u bot.py &
          BOT_PID=$!

          echo "Starting Telegram Script Manager..."
          python -u bott.py &
          TELE_PID=$!

          echo "================================"
          echo "CoCo Production Online"
          echo "WhatsApp PID: $BOT_PID"
          echo "Telegram PID: $TELE_PID"
          echo "================================"

          wait "$BOT_PID"
          BOT_STATUS=$?

          echo "WhatsApp scheduler finished."

          kill "$TELE_PID" 2>/dev/null || true
          wait "$TELE_PID" 2>/dev/null || true

          echo "Telegram bot stopped."
          exit "$BOT_STATUS"

      # ======================================
      # STEP 4 - KEEP ALIVE
      # TARGET 05:58:59
      # ======================================

      - name: Step 4 - Keep Alive
        if: success()
        env:
          RUN_START_EPOCH: ${{ steps.start.outputs.start_epoch }}
        run: |
          python - <<'PY'
          import os
          import time

          start = int(os.environ["RUN_START_EPOCH"])
          target = start + 5 * 3600 + 58 * 60 + 59

          print("STEP 4 - KEEP ALIVE")
          print("Target: 05:58:59")

          while True:
              remaining = target - time.time()

              if remaining <= 0:
                  break

              print(f"Remaining: {int(remaining)} seconds")
              time.sleep(min(remaining, 30))

          print("Keep Alive completed.")
          PY

      # ======================================
      # STEP 5 - SELF RESTART
      # ======================================

      - name: Step 5 - Restart run.yml
        if: success()
        env:
          GHP_T: ${{ secrets.GHP_T }}
          REPOS: ${{ secrets.REPOS }}
        run: |
          python - <<'PY'
          import os
          import sys
          import time
          import requests

          token = os.environ["GHP_T"].strip()
          repo = os.environ["REPOS"].strip()

          if "/" not in repo:
              sys.exit("Invalid REPOS. Use username/repo")

          owner, name = repo.split("/", 1)

          if not owner or not name or "/" in name:
              sys.exit("Invalid repository.")

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          api = "https://api.github.com"

          print("STEP 5 - SELF RESTART")
          print("Repository:", repo)

          try:
              response = requests.get(
                  f"{api}/repos/{owner}/{name}",
                  headers=headers,
                  timeout=30
              )

              response.raise_for_status()

              branch = response.json()["default_branch"]

          except Exception as error:
              sys.exit(f"Repository error: {error}")

          url = (
              f"{api}/repos/{owner}/{name}"
              "/actions/workflows/run.yml/dispatches"
          )

          payload = {"ref": branch}

          for attempt in range(1, 4):
              try:
                  response = requests.post(
                      url,
                      headers=headers,
                      json=payload,
                      timeout=30
                  )

                  if response.status_code == 204:
                      print("SELF RESTART SUCCESS")
                      print("Next workflow dispatched.")
                      sys.exit(0)

                  print(
                      "Attempt:",
                      attempt,
                      response.status_code,
                      response.text
                  )

              except Exception as error:
                  print("Error:", error)

              if attempt < 3:
                  time.sleep(5)

          sys.exit("SELF RESTART FAILED.")
          PY
