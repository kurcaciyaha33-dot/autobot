
name: CoCo Production - Multi Bot System

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coco-production-whatsapp
  cancel-in-progress: false

jobs:
  production:
    name: CoCo Production
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ==========================================
      # STEP 1 - INSTALL DEPENDENCIES
      # ==========================================

      - name: Step 1 - Install Dependency
        uses: actions/checkout@v4

      - name: Record Start Time
        id: start
        run: |
          echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install requests python-telegram-bot

      # ==========================================
      # STEP 2 - VALIDATE SECRETS
      # ==========================================

      - name: Step 2 - Membaca Secrets
        env:
          API_FONNTE: ${{ secrets.API_FONNTE }}
          UID_GB: ${{ secrets.UID_GB }}
          UID_GB2: ${{ secrets.UID_GB2 }}
          OWNER_NUMBER: ${{ secrets.OWNER_NUMBER }}

          TELE_BOT: ${{ secrets.TELE_BOT }}
          PASS_SYS: ${{ secrets.PASS_SYS }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

          GHP_T: ${{ secrets.GHP_T }}
          REPOS: ${{ secrets.REPOS }}

          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}

        run: |
          set -e

          for name in \
            API_FONNTE \
            UID_GB \
            UID_GB2 \
            OWNER_NUMBER \
            TELE_BOT \
            PASS_SYS \
            ADMIN_TOKEN \
            GHP_T \
            REPOS \
            DISCORD_CHANNEL_ID \
            DISCORD_BOT_TOKEN
          do
            if [ -z "${!name}" ]; then
              echo "ERROR: Missing secret: $name"
              exit 1
            fi
          done

          echo "All secrets loaded."

      # ==========================================
      # STEP 3 - RUN bot.py
      # ==========================================

      - name: Step 3 - Run WhatsApp Bot
        env:
          API_FONNTE: ${{ secrets.API_FONNTE }}
          UID_GB: ${{ secrets.UID_GB }}
          UID_GB2: ${{ secrets.UID_GB2 }}
          OWNER_NUMBER: ${{ secrets.OWNER_NUMBER }}
          RUN_START_EPOCH: ${{ steps.start.outputs.start_epoch }}

        run: |
          echo "Starting bot.py..."
          python -u bot.py

          echo "bot.py completed."

      # ==========================================
      # STEP 4 - RUN bott.py
      # ==========================================

      - name: Step 4 - Run Telegram Bot
        env:
          TELE_BOT: ${{ secrets.TELE_BOT }}
          PASS_SYS: ${{ secrets.PASS_SYS }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

        run: |
          echo "Starting bott.py..."
          python -u bott.py

      # ==========================================
      # STEP 5 - RUN botd.py
      # ==========================================

      - name: Step 5 - Run Discord Bot
        env:
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          API_FONNTE: ${{ secrets.API_FONNTE }}
          UID_GB2: ${{ secrets.UID_GB2 }}

        run: |
          echo "Starting botd.py..."
          python -u botd.py

      # ==========================================
      # STEP 6 - KEEP ALIVE
      # ==========================================

      - name: Step 6 - Keep Alive
        if: success()
        env:
          RUN_START_EPOCH: ${{ steps.start.outputs.start_epoch }}

        run: |
          python - <<'PY'
          import os
          import time
          from datetime import timedelta

          start = int(os.environ["RUN_START_EPOCH"])
          target = start + 5 * 3600 + 58 * 60 + 59

          print("KEEP ALIVE - Target 05:58:59")

          while True:
              remaining = target - time.time()

              if remaining <= 0:
                  break

              print(
                  "Remaining:",
                  str(timedelta(seconds=int(remaining)))
              )

              time.sleep(min(remaining, 30))

          print("Keep Alive completed.")
          PY

      # ==========================================
      # STEP 7 - SELF RESTART
      # ==========================================

      - name: Step 7 - Restart run.yml
        if: success()
        env:
          GHP_T: ${{ secrets.GHP_T }}
          REPOS: ${{ secrets.REPOS }}

        run: |
          python - <<'PY'
          import os
          import sys
          import time
          import requests

          token = os.environ["GHP_T"].strip()
          repo = os.environ["REPOS"].strip()

          if "/" not in repo:
              sys.exit("Invalid REPOS. Use username/repository")

          owner, name = repo.split("/", 1)

          if not owner or not name or "/" in name:
              sys.exit("Invalid repository format.")

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          api = "https://api.github.com"

          print("Getting repository information...")

          response = requests.get(
              f"{api}/repos/{owner}/{name}",
              headers=headers,
              timeout=30
          )

          response.raise_for_status()

          branch = response.json()["default_branch"]

          url = (
              f"{api}/repos/{owner}/{name}"
              "/actions/workflows/run.yml/dispatches"
          )

          payload = {"ref": branch}

          for attempt in range(1, 4):
              try:
                  response = requests.post(
                      url,
                      headers=headers,
                      json=payload,
                      timeout=30
                  )

                  if response.status_code == 204:
                      print("SELF RESTART SUCCESS")
                      sys.exit(0)

                  print(
                      f"Attempt {attempt}: "
                      f"{response.status_code} "
                      f"{response.text}"
                  )

              except Exception as error:
                  print("Error:", error)

              if attempt < 3:
                  time.sleep(5)

          sys.exit("SELF RESTART FAILED.")
          PY
