
name: CoCo Production - Multi Bot System

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coco-production-whatsapp
  cancel-in-progress: false

jobs:
  production:
    name: CoCo Production
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ==========================================
      # STEP 1 - INSTALL DEPENDENCIES
      # ==========================================

      - name: Step 1 - Install Dependency
        uses: actions/checkout@v4

      - name: Record Start Time
        id: start
        run: |
          echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install requests python-telegram-bot

          echo "All dependencies installed."

      # ==========================================
      # STEP 2 - READ SECRETS
      # ==========================================

      - name: Step 2 - Membaca Secrets
        env:
          API_FONNTE: ${{ secrets.API_FONNTE }}
          UID_GB: ${{ secrets.UID_GB }}
          UID_GB2: ${{ secrets.UID_GB2 }}
          OWNER_NUMBER: ${{ secrets.OWNER_NUMBER }}

          TELE_BOT: ${{ secrets.TELE_BOT }}
          PASS_SYS: ${{ secrets.PASS_SYS }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

          GHP_T: ${{ secrets.GHP_T }}
          REPOS: ${{ secrets.REPOS }}

          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}

        run: |
          set -e

          for name in \
            API_FONNTE \
            UID_GB \
            UID_GB2 \
            OWNER_NUMBER \
            TELE_BOT \
            PASS_SYS \
            ADMIN_TOKEN \
            GHP_T \
            REPOS \
            DISCORD_CHANNEL_ID \
            DISCORD_BOT_TOKEN
          do
            if [ -z "${!name}" ]; then
              echo "ERROR: Missing secret: $name"
              exit 1
            fi
          done

          echo "All secrets successfully loaded."

      # ==========================================
      # STEP 3 - RUN THREE BOTS
      # ==========================================

      - name: Step 3 - Menjalankan 3 Bot
        env:
          # WhatsApp
          API_FONNTE: ${{ secrets.API_FONNTE }}
          UID_GB: ${{ secrets.UID_GB }}
          UID_GB2: ${{ secrets.UID_GB2 }}
          OWNER_NUMBER: ${{ secrets.OWNER_NUMBER }}

          # Telegram
          TELE_BOT: ${{ secrets.TELE_BOT }}
          PASS_SYS: ${{ secrets.PASS_SYS }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

          # Discord
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}

          RUN_START_EPOCH: ${{ steps.start.outputs.start_epoch }}

        shell: bash
        run: |
          set -e

          echo "===================================="
          echo "       COCO PRODUCTION"
          echo "===================================="

          # Start Telegram
          echo "Starting Telegram Bot..."

          nohup python -u bott.py > bott.log 2>&1 &
          echo $! > bott.pid

          # Start Discord
          echo "Starting Discord Bot..."

          nohup python -u botd.py > botd.log 2>&1 &
          echo $! > botd.pid

          # Give background processes time to start
          sleep 5

          # Check Telegram
          if ! kill -0 "$(cat bott.pid)" 2>/dev/null; then
            echo "Telegram startup failed."
            cat bott.log
            exit 1
          fi

          # Check Discord
          if ! kill -0 "$(cat botd.pid)" 2>/dev/null; then
            echo "Discord startup failed."
            cat botd.log
            exit 1
          fi

          echo "Telegram Bot: RUNNING"
          echo "Discord Bot: RUNNING"

          echo "Starting WhatsApp Scheduler..."

          # WhatsApp runs in foreground
          python -u bot.py

      # ==========================================
      # STEP 4 - KEEP ALIVE
      # ==========================================

      - name: Step 4 - Keep Alive
        if: success()
        env:
          RUN_START_EPOCH: ${{ steps.start.outputs.start_epoch }}

        run: |
          python - <<'PY'
          import os
          import time
          from datetime import timedelta

          start = int(os.environ["RUN_START_EPOCH"])

          target = start + 5 * 3600 + 58 * 60 + 59

          print("====================================")
          print("STEP 4 - KEEP ALIVE")
          print("Target: 05:58:59 from workflow start")
          print("====================================")

          while True:
              remaining = target - time.time()

              if remaining <= 0:
                  break

              print(
                  "Remaining:",
                  str(timedelta(seconds=int(remaining)))
              )

              time.sleep(min(remaining, 30))

          print("Keep Alive completed.")
          PY

      # ==========================================
      # STEP 5 - STOP ALL BACKGROUND BOTS
      # ==========================================

      - name: Step 5 - Stop Background Bots
        if: always()
        run: |
          for file in bott.pid botd.pid; do
            if [ -f "$file" ]; then
              PID=$(cat "$file")

              if kill -0 "$PID" 2>/dev/null; then
                kill "$PID" || true
                echo "Stopped process: $PID"
              fi
            fi
          done

          echo "Background bot shutdown completed."

      # ==========================================
      # STEP 6 - SELF RESTART
      # ==========================================

      - name: Step 6 - Restart run.yml
        if: success()
        env:
          GHP_T: ${{ secrets.GHP_T }}
          REPOS: ${{ secrets.REPOS }}

        run: |
          python - <<'PY'
          import os
          import sys
          import time
          import requests

          token = os.environ["GHP_T"].strip()
          repo = os.environ["REPOS"].strip()

          if "/" not in repo:
              sys.exit("Invalid REPOS. Use username/repository")

          owner, name = repo.split("/", 1)

          if not owner or not name or "/" in name:
              sys.exit("Invalid repository format.")

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28"
          }

          api = "https://api.github.com"

          print("====================================")
          print("STEP 6 - COCO SELF RESTART")
          print("====================================")

          # Get default branch
          try:
              response = requests.get(
                  f"{api}/repos/{owner}/{name}",
                  headers=headers,
                  timeout=30
              )

              response.raise_for_status()

              branch = response.json()["default_branch"]

              print("Repository:", repo)
              print("Branch:", branch)

          except Exception as error:
              sys.exit(f"Repository error: {error}")

          # Dispatch workflow
          url = (
              f"{api}/repos/{owner}/{name}"
              "/actions/workflows/run.yml/dispatches"
          )

          payload = {
              "ref": branch
          }

          for attempt in range(1, 4):
              try:
                  response = requests.post(
                      url,
                      headers=headers,
                      json=payload,
                      timeout=30
                  )

                  if response.status_code == 204:
                      print("====================================")
                      print("SELF RESTART SUCCESS")
                      print("Next workflow dispatched.")
                      print("====================================")
                      sys.exit(0)

                  print(
                      f"Attempt {attempt}: "
                      f"{response.status_code} "
                      f"{response.text}"
                  )

              except Exception as error:
                  print(f"Attempt {attempt} error:", error)

              if attempt < 3:
                  time.sleep(5)

          sys.exit("SELF RESTART FAILED.")
          PY
